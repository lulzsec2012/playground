# ============================================================
# Mullvad WireGuard 配置示例 (Demo)
# ============================================================
# 从 Mullvad 官网下载的实际配置格式与此相同。
# 将实际配置按区域命名放入 data/mullvad/ 目录，例如:
#   data/mullvad/mullvad-us-lax.conf   — 美国 洛杉矶
#   data/mullvad/mullvad-us-nyc.conf   — 美国 纽约
#   data/mullvad/mullvad-sg.conf       — 新加坡
#   data/mullvad/mullvad-jp.conf       — 日本
#   data/mullvad/mullvad-de.conf       — 德国 法兰克福
#
# data/mullvad/ 已在 .gitignore 中，配置不会提交到 git。
# 此 demo 文件仅作格式参考，不会被用于实际连接。
#
# 获取方式:
#   1. 登录 https://mullvad.net/zh/account/
#   2. 进入 "WireGuard 配置" 页面
#   3. 选择服务器 → 下载 .conf 文件
#   4. 放入 data/mullvad/
#   5. 或者使用 proxy-mullvad-fetch 脚本自动拉取
# ============================================================

[Interface]
# 客户端私钥 (替换为你的实际私钥)
PrivateKey = YOUR_CLIENT_PRIVATE_KEY_BASE64_ENCODED
# 客户端在 Mullvad 网络中的 IP 地址
Address = 10.64.0.1/32, fc00:bbbb:bbbb:bb01::1:abcd/128
# DNS 服务器 (Mullvad 的防泄漏 DNS)
DNS = 10.64.0.1

[Peer]
# 服务器公钥
PublicKey = YOUR_SERVER_PUBLIC_KEY_BASE64_ENCODED
# 预共享密钥 (可选，大部分服务器不需要)
# PresharedKey =
# 允许的 IP 范围 (0.0.0.0/0 表示所有流量走 VPN)
AllowedIPs = 0.0.0.0/0, ::/0
# 服务器地址和端口
Endpoint = 123.123.123.123:51820
# 保持连接间隔 (秒)，NAT 穿透用
PersistentKeepalive = 25
