# Site routing groups for sing-box config generation
#
# Each group gets:
#   - a urltest outbound (auto-selects best node by probing test_url)
#   - a selector outbound (manual override in Clash Dashboard)
#   - domain_suffix route rule sending matching traffic to the selector
#
# To add a new site group, just add a new entry here.
# The key is used as the route tag prefix; keep it short and unique.

yt:
  label: "YouTube"
  test_url: "http://cp.cloudflare.com/generate_204"
  domains:
    - youtube.com
    - googlevideo.com
    - ytimg.com
    - youtu.be
    - ggpht.com
    - withgoogle.com

